repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Jinja drops a template's last newline, so the apidoc templates end with a
        # blank line for each page they write to end with one newline.
        exclude: ^docs/_templates/apidoc/
      - id: check-yaml
      - id: check-added-large-files
        # uv writes the lock file, which is text and grows with the dependencies.
        exclude: ^uv\.lock$

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.3.0
    hooks:
      - id: reuse
