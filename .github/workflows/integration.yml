name: Integration Tests

on:
  workflow_dispatch:
  # release.yml runs it before publishing, so a tag doesn't trigger it here.
  workflow_call:
  push:
    branches:
      - main
    # Changes that can't affect a sync.
    paths-ignore:
      - "news/**"
      - "**/*.md"
      - "docs/**/*.rst"
  pull_request:
    paths-ignore:
      - "news/**"
      - "**/*.md"
      - "docs/**/*.rst"

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      # Radicale and Xandikos run embedded; the rest from this repo's fixtures,
      # which the target starts.
      - name: Run integration tests
        run: make test-integration PYTHONVERSION=3.15 UV_GROUPS="--no-default-groups --group test"

      # Each server's log, to read when a test fails; a server that never
      # started has none, and that mustn't hide the others'.
      - name: Show the server logs
        if: ${{ failure() }}
        run: |
          docker exec calendaring-sync-stalwart sh -c 'cat /var/log/stalwart/*' || true
          docker logs calendaring-sync-cyrus || true
          docker logs calendaring-sync-baikal || true

      - name: Stop the servers
        if: ${{ always() }}
        run: bash tests/docker/stop.sh stalwart cyrus baikal
