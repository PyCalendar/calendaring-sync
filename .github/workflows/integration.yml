name: Integration Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    # Changes that can't affect a sync; a tag runs whatever it holds.
    paths-ignore:
      - "news/**"
      - "**/*.md"
      - "docs/**/*.rst"
  pull_request:
    paths-ignore:
      - "news/**"
      - "**/*.md"
      - "docs/**/*.rst"

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          pip-version: "26.2.2"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Radicale and Xandikos run embedded; the rest from this repo's fixtures.
      - name: Start Stalwart, Cyrus and Baïkal
        run: bash tests/docker/start.sh stalwart cyrus baikal

      - name: Run integration tests
        run: |
          pytest src/calendaring_sync/tests/test_caldav_integration.py \
            src/calendaring_sync/tests/test_jmap_integration.py

      # Each server's log, to read when a test fails; a server that never
      # started has none, and that mustn't hide the others'.
      - name: Show the server logs
        if: ${{ failure() }}
        run: |
          docker exec calendaring-sync-stalwart sh -c 'cat /var/log/stalwart/*' || true
          docker logs calendaring-sync-cyrus || true
          docker logs calendaring-sync-baikal || true

      - name: Stop the servers
        if: ${{ always() }}
        run: bash tests/docker/stop.sh stalwart cyrus baikal
