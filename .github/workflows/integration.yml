name: Integration Tests

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          pip-version: "26.2.2"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Stalwart serves both JMAP and CalDAV, from this repo's own fixture.
      - name: Start Stalwart
        run: bash tests/docker/stalwart/start.sh

      # Radicale and Xandikos run embedded; Cyrus and Baïkal are skipped, as
      # nothing starts them here.
      - name: Run integration tests
        run: |
          pytest src/calendaring_sync/tests/test_sync_integration.py \
            src/calendaring_sync/tests/test_jmap_integration.py

      - name: Stop Stalwart
        if: ${{ always() }}
        run: bash tests/docker/stalwart/stop.sh
