# SPDX-FileCopyrightText: 2026 calendaring-sync contributors
# SPDX-License-Identifier: AGPL-3.0-or-later

version = 1

# Auto-generated version file (cannot have persistent headers)
[[annotations]]
path = "src/calendaring_sync/_version.py"
precedence = "override"
SPDX-FileCopyrightText = "2026 calendaring-sync contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Bare version string, no comment syntax available
[[annotations]]
path = ".python-version"
precedence = "override"
SPDX-FileCopyrightText = "2026 calendaring-sync contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "docs/.vale/styles/config/vocabularies/Base/accept.txt"
precedence = "override"
SPDX-FileCopyrightText = "2026 calendaring-sync contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# PEP 561 marker file, must be empty
[[annotations]]
path = "src/calendaring_sync/py.typed"
precedence = "override"
SPDX-FileCopyrightText = "2026 calendaring-sync contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Towncrier news fragments. short-lived, deleted once folded into
# docs/changelog.rst at release time. Not worth a header each.
[[annotations]]
path = "news/*"
precedence = "override"
SPDX-FileCopyrightText = "2026 calendaring-sync contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Recorded server exchanges the unit tests replay. JSON has no comments.
[[annotations]]
path = "src/calendaring_sync/tests/data/caldav/*.json"
precedence = "override"
SPDX-FileCopyrightText = "2026 calendaring-sync contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# GitHub issue form templates: YAML frontmatter must stay the first thing
# in the file for GitHub to parse it, so a leading comment isn't an option.
[[annotations]]
path = ".github/ISSUE_TEMPLATE/*.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 calendaring-sync contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# pycal.org's logo, reused here to show this project is part of the
# Python Calendaring Ecosystem. Binary PNG, no header possible.
[[annotations]]
path = "docs/_static/img/pycal-icon.png"
precedence = "override"
SPDX-FileCopyrightText = "2026 pycal.org"
SPDX-License-Identifier = "CC-BY-SA-4.0"
