[build-system]
requires = ["hatchling>=1.32.4", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[project]
name = "calendaring-sync"
description = "Calendar sync state: sync tokens, object versions, change tracking, and conflict detection"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Sashank Bhamidi" }]
dynamic = ["version"]
keywords = ["calendar", "calendaring", "sync", "synchronization", "conflict-detection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.10",
  "mypy==2.4.0",
  "coverage==7.16.2",
  "pytest-cov==7.1.0",
  "reuse==6.2.0",
  "towncrier==26.9.0",
  "pre-commit==4.6.2",
  "caldav==3.6.0",
  "icalendar==7.3.0",
  "lxml==6.1.3",
  "radicale==3.8.3",
  "xandikos==0.4.10",
  "calendaring-jmap @ git+https://github.com/pycalendar/calendaring-jmap@21a3f25d55b393b821a4b74c6e93a4c6c1d701c2",
  "niquests==3.21.2",
]
caldav = [
  "caldav>=3.6.0",
  "icalendar>=7.3.0",
  "lxml>=6.1.3",
]
jmap = [
  "calendaring-jmap>=2.0.0",
]
docs = [
  "sphinx==9.1.0",
  "pydata-sphinx-theme==0.23.0",
  "matplotlib==3.11.2",
  "sphinx-autobuild==2025.8.25",
  "sphinx-copybutton==0.5.2",
  "sphinx-design==0.7.0",
  "sphinx-issues==6.0.0",
  "sphinx-last-updated-by-git==0.3.8",
  "sphinx-notfound-page==1.1.0",
  "sphinxcontrib-mermaid==2.1.1",
  "sphinxext-opengraph==0.13.0",
  "caldav==3.6.0",
  "calendaring-jmap @ git+https://github.com/pycalendar/calendaring-jmap@21a3f25d55b393b821a4b74c6e93a4c6c1d701c2",
]

[project.urls]
Repository = "https://github.com/pycalendar/calendaring-sync"
Issues = "https://github.com/pycalendar/calendaring-sync/issues"
Documentation = "https://calendaring-sync.readthedocs.io/en/latest/"
Changelog = "https://calendaring-sync.readthedocs.io/en/latest/changelog.html"

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.hooks.vcs]
version-file = "src/calendaring_sync/_version.py"

[tool.hatch.build]
# Excludes dotfiles and top-level files with an extension by default, so a new
# local-only file at the repo root (an editor config, a local notes file) does
# not silently end up in the sdist just because it is not in .gitignore.
exclude = [
  "/.*",
  "/*.*",
  "/dist",
  "/build",
]

[tool.hatch.build.targets.wheel]
packages = ["src/calendaring_sync"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["calendaring_sync"]

[tool.pytest.ini_options]
testpaths = ["src/calendaring_sync/tests"]

[tool.towncrier]
directory = "news/"
filename = "docs/changelog.rst"
issue_format = "`#{issue} <https://github.com/pycalendar/calendaring-sync/issues/{issue}>`_"
start_string = ".. towncrier release notes start\n"
title_format = "{version} ({project_date})"
underlines = ["-", "~", "`"]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Removals and deprecations"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "deps"
name = "Dependency changes"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "Internal changes"
showcontent = true

[[tool.towncrier.type]]
directory = "chore"
name = "Other tasks"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security fixes"
showcontent = true
