[build-system]
requires = ["hatchling>=1.32.4", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[project]
name = "calendaring-sync"
description = "Calendar sync state: sync tokens, object versions, change tracking, and conflict detection"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Sashank Bhamidi" }]
dynamic = ["version"]
keywords = ["calendar", "calendaring", "sync", "synchronization", "conflict-detection"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.2",
  "mypy==2.4.0",
  "coverage==7.17.0",
  "pytest-cov==7.1.0",
  "reuse==6.2.0",
  "towncrier==26.9.0",
  "pre-commit==4.7.0",
  "caldav==3.7.0",
  "icalendar==7.3.0",
  "radicale==3.9.0",
  "xandikos==0.4.10",
  "calendaring-jmap==2.0.0",
  "niquests==3.21.2",
]
caldav = [
  "caldav>=3.7.0",
  "icalendar>=7.3.0",
]
jmap = [
  "calendaring-jmap>=2.0.0",
]
docs = [
  "sphinx==9.2.0",
  "pydata-sphinx-theme==0.23.0",
  "matplotlib==3.11.2",
  "sphinx-autobuild==2025.8.25",
  "sphinx-copybutton==0.5.2",
  "sphinx-design==0.7.0",
  "sphinx-issues==6.0.0",
  "sphinx-last-updated-by-git==0.3.8",
  "sphinx-llms-txt==0.7.1",
  "sphinx-notfound-page==1.1.0",
  "sphinxcontrib-mermaid==2.1.1",
  "sphinxext-opengraph==0.13.0",
  "caldav==3.7.0",
  "calendaring-jmap==2.0.0",
]

[project.urls]
Repository = "https://github.com/PyCalendar/calendaring-sync"
Issues = "https://github.com/PyCalendar/calendaring-sync/issues"
Documentation = "https://calendaring-sync.readthedocs.io/en/stable/"
Changelog = "https://calendaring-sync.readthedocs.io/en/stable/changelog.html"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/calendaring_sync/_version.py"

[tool.hatch.build]
# Excludes dotfiles and top-level files with an extension by default, so a new
# local-only file at the repo root (an editor config, a local notes file) does
# not silently end up in the sdist just because it is not in .gitignore.
exclude = [
  "/.*",
  "/*.*",
  "/dist",
  "/build",
]

[tool.hatch.build.targets.wheel]
packages = ["src/calendaring_sync"]
# The tests and their recordings run from a checkout or the sdist, which hold
# the docs examples some of them run; an installed package doesn't need them.
exclude = ["src/calendaring_sync/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "UP", "B",
  "A", "C4", "EXE", "FLY", "FURB", "G", "ICN", "INT", "ISC", "LOG", "PERF", "PGH",
  "PIE", "PLE", "PLW", "RET", "RSE", "RUF", "SIM", "SLOT", "T10", "TID", "TRY",
]
# Left out on purpose: T20, since the benchmark, the recorders, the fixture
# setups and two docs examples print; N, whose only findings are the __init__ that _checks.py
# generates; COM and Q, which the formatter decides.
ignore = [
  # Error messages are written where they're raised, naming the value.
  "TRY003",
  # A value of the right type that holds the wrong thing raises ValueError.
  "TRY004",
  # Implicit string concatenation is the formatter's call.
  "ISC001",
  # A noqa can name a rule this project doesn't enable, to say why a line
  # catches every exception.
  "RUF100",
]

[tool.ruff.lint.per-file-ignores]
# Each block a docs page shows brings its own imports, after the setup it doesn't show.
"docs/examples/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["calendaring_sync"]
# The modules the docs examples share.
known-local-folder = ["memory_adapter", "start"]

[tool.mypy]
# Everything mypy reads, the tests and the docs examples included, is checked
# inside functions without annotations too.
check_untyped_defs = true
strict_equality = true
extra_checks = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# The package is strict, as --strict is, except for calls into functions
# without annotations, such as icalendar's content lines and python-caldav's
# feature checks.
module = ["calendaring_sync.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
implicit_reexport = false

[[tool.mypy.overrides]]
# The tests don't need annotations, so a fixture or a table reads as it is,
# and may subclass and return what the docs examples and the replays give
# them, which load at run time and type as Any.
module = ["calendaring_sync.tests.*"]
disallow_subclassing_any = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["src/calendaring_sync/tests"]

[tool.towncrier]
directory = "news/"
filename = "docs/changelog.rst"
issue_format = "`#{issue} <https://github.com/PyCalendar/calendaring-sync/issues/{issue}>`_"
start_string = ".. towncrier release notes start\n"
title_format = "{version} ({project_date})"
underlines = ["-", "~", "`"]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Removals and deprecations"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "deps"
name = "Dependency changes"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "Internal changes"
showcontent = true

[[tool.towncrier.type]]
directory = "chore"
name = "Other tasks"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security fixes"
showcontent = true
