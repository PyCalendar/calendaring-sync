StylesPath = docs/styles
MinAlertLevel = suggestion
Vocab = Base, calendaring-sync
Packages = Microsoft

[*.rst]
BasedOnStyles = Vale, Microsoft, calendaring-sync
Microsoft.Contractions = suggestion
Microsoft.GeneralURL = NO
# calendaring-sync's own Quotes rule allows a single letter in quotes followed
# by punctuation, which Microsoft.Quotes refuses.
Microsoft.Quotes = NO
Microsoft.Units = suggestion

# Ignore Sphinx Python object roles, such as ":class:" and ":meth:",
# to prevent false positives from Microsoft.Spacing on dotted Python names.
TokenIgnores = :[a-z]+:\x60[^\x60]+\x60
